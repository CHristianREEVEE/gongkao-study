<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover,maximum-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#1a1721">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="公考后台">
<title>公考 · 后台管理</title>
<style>
:root{
  --bg:#1a1721;--bg-2:#221e2c;--bg-3:#2a2438;
  --card:rgba(255,255,255,0.04);--card-solid:#252130;
  --border:rgba(255,255,255,0.08);--border-strong:rgba(255,255,255,0.15);
  --text:#e8e4ec;--text-mid:#a8a0b8;--text-dim:#6e6878;
  --accent:#8b7ec8;--accent-light:#a894e0;--accent-glow:rgba(139,126,200,0.15);
  --green:#6cbf84;--orange:#d4a574;--red:#d47474;--blue:#7494d4;
  --radius:14px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:0 0 80px 0;overflow-x:hidden;-webkit-overflow-scrolling:touch}
header{background:linear-gradient(180deg,#2a2438 0%,#1a1721 100%);padding:40px 20px 16px;text-align:center;position:sticky;top:0;z-index:100;border-bottom:1px solid var(--border)}
.back-link{font-size:13px;color:var(--text-dim);text-decoration:none;margin-bottom:6px;display:inline-block}
.main-title{font-size:24px;font-weight:800;letter-spacing:1px;background:linear-gradient(135deg,var(--accent-light),var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.container{max-width:600px;margin:0 auto;padding:16px}
.nav-tabs{display:flex;gap:2px;padding:6px 8px;overflow-x:auto;scrollbar-width:none;flex-wrap:nowrap;white-space:nowrap;background:var(--bg-2);border:1px solid var(--border);border-radius:12px;margin-bottom:16px;position:sticky;top:0;z-index:99}
.nav-tabs::-webkit-scrollbar{display:none}
.nav-tab{flex-shrink:0;padding:8px 14px;cursor:pointer;color:var(--text-dim);font-size:13px;font-weight:500;border:none;border-radius:8px;transition:all .2s;white-space:nowrap;background:transparent}
.nav-tab.active{background:var(--accent-glow);color:var(--accent-light);font-weight:700}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:16px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.card-title{font-size:16px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.stat-card{background:var(--card-solid);border:1px solid var(--border);border-radius:12px;padding:16px;text-align:center}
.stat-card .stat-value{font-size:28px;font-weight:800;color:var(--accent-light)}
.stat-card .stat-label{font-size:12px;color:var(--text-dim);margin-top:4px}
.stat-card .stat-sub{font-size:11px;color:var(--text-dim);margin-top:2px}
.data-table{width:100%;border-collapse:collapse;font-size:13px}
.data-table th{text-align:left;padding:8px 10px;border-bottom:2px solid var(--border);color:var(--text-dim);font-weight:600;font-size:12px}
.data-table td{padding:8px 10px;border-bottom:1px solid var(--border)}
.data-table tr:last-child td{border-bottom:none}
.data-table .num{text-align:right;font-variant-numeric:tabular-nums}
.btn{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:12px 24px;font-size:15px;font-weight:600;cursor:pointer;transition:all .2s;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:active{transform:scale(0.95)}
.btn-outline{background:transparent;border:1px solid var(--border-strong);color:var(--text)}
.btn-outline:active{background:var(--card)}
.btn-green{background:var(--green)}
.btn-orange{background:var(--orange)}
.btn-red{background:var(--red)}
.btn-sm{padding:6px 14px;font-size:13px;min-height:36px;border-radius:8px}
.input{background:var(--card-solid);border:1px solid var(--border);border-radius:8px;padding:8px 12px;color:var(--text);font-size:14px;min-height:36px;width:100%}
.input:focus{outline:none;border-color:var(--accent)}
.input-row{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.input-row .input{flex:1;min-width:120px}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:var(--card-solid);border:1px solid var(--border-strong);border-radius:12px;padding:12px 24px;color:var(--text);font-size:14px;z-index:2000;opacity:0;transition:all .3s;pointer-events:none;box-shadow:0 4px 20px rgba(0,0,0,0.3)}
.toast.show{opacity:1;bottom:50px}
.toast.success{border-color:var(--green)}
.toast.warn{border-color:var(--orange)}
.confirm-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);z-index:1000;display:none;align-items:center;justify-content:center}
.confirm-overlay.show{display:flex}
.confirm-modal{background:var(--card-solid);border:1px solid var(--border-strong);border-radius:16px;padding:24px;z-index:1500;text-align:center;max-width:300px}
.confirm-modal.show{display:block}
.confirm-text{margin-bottom:20px;font-size:15px}
.confirm-btns{display:flex;gap:10px;justify-content:center}
.empty{text-align:center;color:var(--text-dim);font-size:14px;padding:20px}
.wheel-edit-row{display:flex;gap:6px;margin-bottom:6px;align-items:center}
.wheel-edit-row input{flex:1;background:var(--card-solid);border:1px solid var(--border);border-radius:8px;padding:8px 10px;color:var(--text);font-size:13px;min-height:36px}
.wheel-edit-row input:focus{outline:none;border-color:var(--accent)}
.wheel-cat-label{font-size:13px;color:var(--text-mid);margin:8px 0 4px;font-weight:600}
.section-label{font-size:13px;color:var(--text-mid);margin:10px 0 4px;font-weight:600}
textarea.input{min-height:80px;resize:vertical;font-family:inherit;line-height:1.5}
.stat-bar-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:12px}
.stat-bar-bg{flex:1;height:16px;background:var(--card-solid);border-radius:8px;overflow:hidden}
.stat-bar-fill{height:100%;background:var(--accent);border-radius:8px}
.stat-bar-label{width:60px;color:var(--text-dim)}
.stat-bar-value{width:60px;text-align:right;color:var(--text)}
</style>
</head>
<body>

<header>
  <a href="index.html" class="back-link">← 返回工作台</a>
  <div class="main-title">公考 · 后台管理</div>
</header>

<div class="container">
<div class="nav-tabs" id="nav-tabs">
  <div class="nav-tab active" onclick="showPanel('overview',this)">📊 概览</div>
  <div class="nav-tab" onclick="showPanel('tasks',this)">📋 任务</div>
  <div class="nav-tab" onclick="showPanel('schedule',this)">📅 作息</div>
  <div class="nav-tab" onclick="showPanel('timer',this)">⏱ 计时</div>
  <div class="nav-tab" onclick="showPanel('review',this)">📝 复盘</div>
  <div class="nav-tab" onclick="showPanel('checkin',this)">✅ 打卡</div>
  <div class="nav-tab" onclick="showPanel('memo',this)">📌 备忘</div>
  <div class="nav-tab" onclick="showPanel('wheel',this)">🎰 转盘</div>
  <div class="nav-tab" onclick="showPanel('raw',this)">🔧 原始数据</div>
  <div class="nav-tab" onclick="showPanel('backup',this)">💾 备份</div>
</div>

<div id="panel-overview" class="panel-content"></div>
<div id="panel-tasks" class="panel-content" style="display:none"></div>
<div id="panel-schedule" class="panel-content" style="display:none"></div>
<div id="panel-timer" class="panel-content" style="display:none"></div>
<div id="panel-review" class="panel-content" style="display:none"></div>
<div id="panel-checkin" class="panel-content" style="display:none"></div>
<div id="panel-memo" class="panel-content" style="display:none"></div>
<div id="panel-wheel" class="panel-content" style="display:none"></div>
<div id="panel-raw" class="panel-content" style="display:none"></div>
<div id="panel-backup" class="panel-content" style="display:none"></div>
</div>

<div class="confirm-overlay" id="confirm-overlay">
  <div class="confirm-modal" id="confirm-modal">
    <div class="confirm-text" id="confirm-text">确认？</div>
    <div class="confirm-btns">
      <button class="btn btn-outline btn-sm" onclick="closeConfirm()">取消</button>
      <button class="btn btn-red btn-sm" id="confirm-ok-btn">确认</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ====== Storage (gk_ prefix, same as gongkao-study) ======
const DB={
  get:function(key,def){
    try{var v=localStorage.getItem('gk_'+key);return v?JSON.parse(v):def}catch(e){return def}
  },
  set:function(key,val){localStorage.setItem('gk_'+key,JSON.stringify(val))},
  del:function(key){localStorage.removeItem('gk_'+key)},
  keys:function(){
    var arr=[];
    for(var i=0;i<localStorage.length;i++){
      var k=localStorage.key(i);
      if(k&&k.startsWith('gk_'))arr.push(k.slice(3));
    }
    return arr;
  }
};

// ====== Toast ======
var toastTimer;
function toast(msg,type){
  type=type||'';
  var t=document.getElementById('toast');
  t.textContent=msg;
  t.className='toast show '+type;
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){t.classList.remove('show')},2000);
}

// ====== Confirm ======
var confirmCallback=null;
function showConfirm(msg,cb){
  document.getElementById('confirm-text').textContent=msg;
  document.getElementById('confirm-overlay').classList.add('show');
  document.getElementById('confirm-modal').classList.add('show');
  confirmCallback=cb;
}
document.getElementById('confirm-ok-btn').onclick=function(){
  closeConfirm();
  if(confirmCallback)confirmCallback();
  confirmCallback=null;
};
function closeConfirm(){
  document.getElementById('confirm-overlay').classList.remove('show');
  document.getElementById('confirm-modal').classList.remove('show');
}

// ====== Helpers ======
function today(){return new Date().toISOString().slice(0,10)}
function fmtMin(s){return Math.floor(s/60)+'分钟'}
function fmtHour(s){return(s/3600).toFixed(1)+'小时'}
function esc(s){var d=document.createElement('div');d.textContent=s||'';return d.innerHTML}

// ====== Panel Switching ======
function showPanel(name,el){
  document.querySelectorAll('.nav-tab').forEach(function(t){t.classList.remove('active')});
  if(el)el.classList.add('active');
  document.querySelectorAll('.panel-content').forEach(function(p){p.style.display='none'});
  var panel=document.getElementById('panel-'+name);
  if(panel)panel.style.display='block';
  // Render content
  if(name==='overview')renderOverview();
  if(name==='tasks')renderTasks();
  if(name==='schedule')renderSchedule();
  if(name==='timer')renderTimer();
  if(name==='review')renderReview();
  if(name==='checkin')renderCheckin();
  if(name==='memo')renderMemo();
  if(name==='wheel')renderWheel();
  if(name==='raw')renderRaw();
  if(name==='backup')renderBackup();
}

// ====== Data Getters ======
function getCheckins(){return DB.get('checkins',[])}
function getTimerData(){return DB.get('timer_segments',{})}
function getScheduleDone(date){return DB.get('schedule_'+date,[])}
function getTasksDone(date){return DB.get('tasks_'+date,[])}
function getReview(date){return DB.get('review_'+date,'')}
function getMemos(){return DB.get('memos',[])}
function getWheelOptions(){return DB.get('wheel_options',{out:['citywalk','骑行','逛街','看电影','猫咖探店','户外散步'],food:['火锅','烤肉','自助','滨寿司','烤鱼','日料简餐']})}

// ====== Static task/schedule definitions (match index.html) ======
var taskList=[
  {cat:'言语理解',time:'2小时',desc:'优先复习行测5000题'},
  {cat:'资料分析',time:'2小时',desc:'优先完成超大杯习题'},
  {cat:'判断推理-逻辑判断',time:'40分钟',desc:''},
  {cat:'判断推理-图形推理',time:'50分钟',desc:''},
  {cat:'判断推理-定义+类比',time:'30分钟',desc:''},
  {cat:'数量关系',time:'1.5小时',desc:'花生十三600题'},
  {cat:'申论',time:'2小时',desc:'练习小题+大作文'}
];
var scheduleList=[
  {time:'8:00',text:'起床'},
  {time:'8:30-12:00',text:'学习（3.5小时）'},
  {time:'12:00-14:00',text:'午休'},
  {time:'14:00-17:30',text:'学习（3.5小时）'},
  {time:'17:30-19:00',text:'爬坡运动'},
  {time:'19:00-22:00',text:'学习（3小时）'},
  {time:'23:00',text:'睡觉'}
];

// ====== Panel: Overview ======
function renderOverview(){
  var checkins=getCheckins();
  var timerData=getTimerData();
  var totalSec=0,totalSegs=0,studyDays=0;
  for(var d in timerData){
    var segs=timerData[d];
    if(segs&&segs.length){
      studyDays++;
      segs.forEach(function(s){totalSec+=s.duration;totalSegs++});
    }
  }
  // Today's tasks
  var todayTasks=getTasksDone(today());
  var todaySched=getScheduleDone(today());
  // Recent 7 days stats
  var recent7=[];
  for(var i=6;i>=0;i--){
    var dt=new Date();dt.setDate(dt.getDate()-i);
    var ds=dt.toISOString().slice(0,10);
    var segs=timerData[ds]||[];
    var sec=segs.reduce(function(s,x){return s+x.duration},0);
    recent7.push({date:ds,sec:sec,segs:segs.length});
  }
  var maxVal=Math.max.apply(null,recent7.map(function(r){return r.sec}).concat([1]));

  var html='<div class="card"><div class="card-title">📊 数据概览</div><div class="stat-grid">';
  html+='<div class="stat-card"><div class="stat-value">'+checkins.length+'</div><div class="stat-label">累计打卡天数</div></div>';
  html+='<div class="stat-card"><div class="stat-value">'+studyDays+'</div><div class="stat-label">学习天数</div></div>';
  html+='<div class="stat-card"><div class="stat-value">'+fmtHour(totalSec)+'</div><div class="stat-label">总学习时长</div></div>';
  html+='<div class="stat-card"><div class="stat-value">'+totalSegs+'</div><div class="stat-label">计时段数</div></div>';
  html+='<div class="stat-card"><div class="stat-value">'+todayTasks.length+'/'+taskList.length+'</div><div class="stat-label">今日任务</div></div>';
  html+='<div class="stat-card"><div class="stat-value">'+todaySched.length+'/'+scheduleList.length+'</div><div class="stat-label">今日作息</div></div>';
  html+='</div></div>';

  // Recent 7 days chart
  html+='<div class="card"><div class="card-title">📈 近7天学习时长</div>';
  var dayNames=['日','一','二','三','四','五','六'];
  recent7.forEach(function(r){
    var pct=Math.round(r.sec/maxVal*100);
    var dt=new Date(r.date);
    var label='周'+dayNames[dt.getDay()];
    html+='<div class="stat-bar-row"><span class="stat-bar-label">'+label+'</span><div class="stat-bar-bg"><div class="stat-bar-fill" style="width:'+pct+'%"></div></div><span class="stat-bar-value">'+fmtMin(r.sec)+'</span></div>';
  });
  html+='</div>';

  // Task completion overview
  html+='<div class="card"><div class="card-title">📋 任务完成情况</div>';
  html+='<table class="data-table"><thead><tr><th>任务</th><th>时间</th><th class="num">完成天数</th><th class="num">操作</th></tr></thead><tbody>';
  // Calculate completion per task across all dates
  var taskCompletion={};
  DB.keys().forEach(function(k){
    if(k.startsWith('tasks_')&&k.length===16){
      var date=k.slice(6);
      var done=DB.get(k,[]);
      done.forEach(function(idx){taskCompletion[idx]=(taskCompletion[idx]||0)+1});
    }
  });
  taskList.forEach(function(t,i){
    var count=taskCompletion[i]||0;
    html+='<tr><td>'+esc(t.cat)+'</td><td>'+esc(t.time)+'</td><td class="num">'+count+'</td><td class="num"><button class="btn btn-sm btn-outline" onclick="adjustTaskCount('+i+')">调整</button></td></tr>';
  });
  html+='</tbody></table></div>';

  document.getElementById('panel-overview').innerHTML=html;
}

function adjustTaskCount(idx){
  var current=0;
  DB.keys().forEach(function(k){
    if(k.startsWith('tasks_')&&k.length===16){
      var done=DB.get(k,[]);
      if(done.includes(idx))current++;
    }
  });
  var val=prompt('输入新的完成天数（当前：'+current+'）：',String(current));
  if(val===null)return;
  var n=parseInt(val)||0;
  if(n<0){toast('不能为负数','warn');return}
  // We can't reconstruct which dates had this task checked, so we just show a note
  toast('任务完成天数统计是自动计算的，请通过「任务」面板修改具体日期的打卡状态','warn');
}

// ====== Panel: Tasks ======
function renderTasks(){
  var html='<div class="card"><div class="card-title">📋 学习任务管理</div>';
  html+='<div class="section-label">选择日期</div>';
  html+='<div class="input-row"><input type="date" class="input" id="task-date" value="'+today()+'"></div>';
  html+='<div id="task-edit-area"></div>';
  html+='</div>';
  document.getElementById('panel-tasks').innerHTML=html;
  document.getElementById('task-date').onchange=renderTaskEditArea;
  renderTaskEditArea();
}
function renderTaskEditArea(){
  var date=document.getElementById('task-date').value||today();
  var done=getTasksDone(date);
  var html='<table class="data-table"><thead><tr><th>任务</th><th>时间</th><th class="num">状态</th></tr></thead><tbody>';
  taskList.forEach(function(t,i){
    var isChecked=done.includes(i);
    html+='<tr><td>'+esc(t.cat)+(t.desc?'<br><span style="font-size:11px;color:var(--text-dim)">'+esc(t.desc)+'</span>':'')+'</td>';
    html+='<td>'+esc(t.time)+'</td>';
    html+='<td class="num"><button class="btn btn-sm '+(isChecked?'btn-green':'btn-outline')+'" onclick="toggleTaskDate(\''+date+'\','+i+')">'+(isChecked?'已完成':'未完成')+'</button></td>';
    html+='</tr>';
  });
  html+='</tbody></table>';
  html+='<div style="margin-top:12px"><button class="btn btn-red btn-sm" onclick="clearAllTasks(\''+date+'\')">清空当日所有任务完成状态</button></div>';
  document.getElementById('task-edit-area').innerHTML=html;
}
function toggleTaskDate(date,idx){
  var done=getTasksDone(date);
  if(done.includes(idx)){done=done.filter(function(x){return x!==idx})}
  else{done.push(idx)}
  DB.set('tasks_'+date,done);
  renderTaskEditArea();
  toast('已更新 ✅','success');
}
function clearAllTasks(date){
  showConfirm('清空 '+date+' 所有任务完成状态？',function(){
    DB.del('tasks_'+date);
    renderTaskEditArea();
    toast('已清空','');
  });
}

// ====== Panel: Schedule ======
function renderSchedule(){
  var html='<div class="card"><div class="card-title">📅 作息规划管理</div>';
  html+='<div class="section-label">选择日期</div>';
  html+='<div class="input-row"><input type="date" class="input" id="sched-date" value="'+today()+'"></div>';
  html+='<div id="sched-edit-area"></div>';
  html+='</div>';
  document.getElementById('panel-schedule').innerHTML=html;
  document.getElementById('sched-date').onchange=renderSchedEditArea;
  renderSchedEditArea();
}
function renderSchedEditArea(){
  var date=document.getElementById('sched-date').value||today();
  var done=getScheduleDone(date);
  var html='<table class="data-table"><thead><tr><th>时间</th><th>项目</th><th class="num">状态</th></tr></thead><tbody>';
  scheduleList.forEach(function(s,i){
    var isChecked=done.includes(i);
    html+='<tr><td>'+esc(s.time)+'</td><td>'+esc(s.text)+'</td>';
    html+='<td class="num"><button class="btn btn-sm '+(isChecked?'btn-green':'btn-outline')+'" onclick="toggleSchedDate(\''+date+'\','+i+')">'+(isChecked?'已完成':'未完成')+'</button></td>';
    html+='</tr>';
  });
  html+='</tbody></table>';
  html+='<div style="margin-top:12px"><button class="btn btn-red btn-sm" onclick="clearAllSched(\''+date+'\')">清空当日作息完成状态</button></div>';
  document.getElementById('sched-edit-area').innerHTML=html;
}
function toggleSchedDate(date,idx){
  var done=getScheduleDone(date);
  if(done.includes(idx)){done=done.filter(function(x){return x!==idx})}
  else{done.push(idx)}
  DB.set('schedule_'+date,done);
  renderSchedEditArea();
  toast('已更新 ✅','success');
}
function clearAllSched(date){
  showConfirm('清空 '+date+' 作息完成状态？',function(){
    DB.del('schedule_'+date);
    renderSchedEditArea();
    toast('已清空','');
  });
}

// ====== Panel: Timer ======
function renderTimer(){
  var timerData=getTimerData();
  var dates=Object.keys(timerData).sort().reverse();
  var html='<div class="card"><div class="card-title">⏱ 计时段记录</div>';
  if(!dates.length){
    html+='<div class="empty">暂无计时记录</div>';
  }else{
    dates.forEach(function(date){
      var segs=timerData[date]||[];
      var totalSec=segs.reduce(function(s,x){return s+x.duration},0);
      html+='<div style="margin-bottom:12px;padding:12px;background:var(--card-solid);border-radius:10px;border:1px solid var(--border)">';
      html+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><b>'+date+'</b><span style="color:var(--accent-light)">'+fmtHour(totalSec)+' · '+segs.length+'段</span></div>';
      if(segs.length){
        html+='<table class="data-table"><thead><tr><th>开始</th><th>结束</th><th class="num">时长</th><th class="num">操作</th></tr></thead><tbody>';
        segs.forEach(function(s,idx){
          var st=new Date(s.start),en=new Date(s.end);
          html+='<tr><td>'+st.toTimeString().slice(0,5)+'</td><td>'+en.toTimeString().slice(0,5)+'</td><td class="num">'+fmtMin(s.duration)+'</td>';
          html+='<td class="num"><button class="btn btn-sm btn-red" onclick="delSegment(\''+date+'\','+idx+')">删除</button></td></tr>';
        });
        html+='</tbody></table>';
      }
      html+='<div style="margin-top:8px"><button class="btn btn-sm btn-red" onclick="delAllSegments(\''+date+'\')">删除当日全部</button></div>';
      html+='</div>';
    });
  }
  html+='</div>';
  document.getElementById('panel-timer').innerHTML=html;
}
function delSegment(date,idx){
  showConfirm('删除这计时段？',function(){
    var data=getTimerData();
    if(data[date]&&data[date][idx]){
      data[date].splice(idx,1);
      if(!data[date].length)delete data[date];
      DB.set('timer_segments',data);
      renderTimer();
      toast('已删除','');
    }
  });
}
function delAllSegments(date){
  showConfirm('删除 '+date+' 全部计时段？',function(){
    var data=getTimerData();
    delete data[date];
    DB.set('timer_segments',data);
    renderTimer();
    toast('已删除','');
  });
}

// ====== Panel: Review ======
function renderReview(){
  var html='<div class="card"><div class="card-title">📝 每日复盘</div>';
  html+='<div class="section-label">选择日期</div>';
  html+='<div class="input-row"><input type="date" class="input" id="review-date" value="'+today()+'"></div>';
  html+='<div id="review-edit-area"></div>';
  html+='</div>';
  html+='<div class="card"><div class="card-title">📜 历史复盘记录</div><div id="review-history"></div></div>';
  document.getElementById('panel-review').innerHTML=html;
  document.getElementById('review-date').onchange=renderReviewEditArea;
  renderReviewEditArea();
  renderReviewHistory();
}
function renderReviewEditArea(){
  var date=document.getElementById('review-date').value||today();
  var text=getReview(date);
  var html='<textarea class="input" id="review-text" placeholder="复盘内容...">'+esc(text)+'</textarea>';
  html+='<div style="margin-top:8px"><button class="btn btn-sm" onclick="saveReviewDate(\''+date+'\')">💾 保存</button> <button class="btn btn-sm btn-red" onclick="delReviewDate(\''+date+'\')">删除</button></div>';
  document.getElementById('review-edit-area').innerHTML=html;
}
function renderReviewHistory(){
  var keys=DB.keys().filter(function(k){return k.startsWith('review_')&&k.length>=18});
  keys.sort().reverse();
  if(!keys.length){document.getElementById('review-history').innerHTML='<div class="empty">暂无复盘记录</div>';return}
  var html='';
  keys.forEach(function(k){
    var date=k.slice(7);
    var text=getReview(date);
    var preview=text?text.slice(0,50):(text===''?'(空)':'');
    html+='<div style="padding:8px 0;border-bottom:1px solid var(--border)"><b>'+date+'</b> <span style="color:var(--text-dim);font-size:12px">'+esc(preview)+'</span></div>';
  });
  document.getElementById('review-history').innerHTML=html;
}
function saveReviewDate(date){
  var text=document.getElementById('review-text').value;
  DB.set('review_'+date,text);
  toast('已保存 ✅','success');
  renderReviewHistory();
}
function delReviewDate(date){
  showConfirm('删除 '+date+' 的复盘？',function(){
    DB.del('review_'+date);
    renderReviewEditArea();
    renderReviewHistory();
    toast('已删除','');
  });
}

// ====== Panel: Checkin ======
function renderCheckin(){
  var checkins=getCheckins().sort().reverse();
  var html='<div class="card"><div class="card-title">✅ 打卡记录</div>';
  html+='<div class="input-row"><input type="date" class="input" id="checkin-date" value="'+today()+'"> <button class="btn btn-sm" onclick="addCheckin()">添加打卡</button></div>';
  if(!checkins.length){
    html+='<div class="empty">暂无打卡记录</div>';
  }else{
    html+='<table class="data-table"><thead><tr><th>日期</th><th class="num">操作</th></tr></thead><tbody>';
    checkins.forEach(function(d){
      html+='<tr><td>'+d+'</td><td class="num"><button class="btn btn-sm btn-red" onclick="delCheckin(\''+d+'\')">删除</button></td></tr>';
    });
    html+='</tbody></table>';
  }
  html+='</div>';
  document.getElementById('panel-checkin').innerHTML=html;
}
function addCheckin(){
  var date=document.getElementById('checkin-date').value||today();
  var checkins=getCheckins();
  if(!checkins.includes(date)){
    checkins.push(date);
    DB.set('checkins',checkins);
    toast('已添加 '+date+' 打卡 ✅','success');
  }else{
    toast(date+' 已打卡','');
  }
  renderCheckin();
}
function delCheckin(date){
  showConfirm('删除 '+date+' 的打卡记录？',function(){
    var checkins=getCheckins().filter(function(d){return d!==date});
    DB.set('checkins',checkins);
    renderCheckin();
    toast('已删除','');
  });
}

// ====== Panel: Memo ======
function renderMemo(){
  var memos=getMemos();
  var html='<div class="card"><div class="card-title">📌 备忘录管理</div>';
  html+='<div class="input-row"><input type="text" class="input" id="new-memo" placeholder="新备忘内容..."> <button class="btn btn-sm" onclick="addMemoAdmin()">添加</button></div>';
  if(!memos.length){
    html+='<div class="empty">暂无备忘</div>';
  }else{
    memos.forEach(function(m){
      var dt=new Date(m.created);
      html+='<div style="padding:10px;background:var(--card-solid);border-radius:8px;margin-bottom:6px;border:1px solid var(--border)">';
      html+='<div style="font-size:11px;color:var(--text-dim);margin-bottom:4px">'+dt.toLocaleString('zh-CN')+'</div>';
      html+='<div style="font-size:14px;margin-bottom:6px">'+esc(m.text)+'</div>';
      html+='<button class="btn btn-sm btn-red" onclick="delMemoAdmin('+m.id+')">删除</button>';
      html+='</div>';
    });
  }
  html+='</div>';
  document.getElementById('panel-memo').innerHTML=html;
}
function addMemoAdmin(){
  var text=document.getElementById('new-memo').value.trim();
  if(!text){toast('内容不能为空','warn');return}
  var memos=getMemos();
  memos.unshift({id:Date.now(),text:text,created:Date.now()});
  DB.set('memos',memos);
  document.getElementById('new-memo').value='';
  renderMemo();
  toast('已添加 ✅','success');
}
function delMemoAdmin(id){
  showConfirm('删除这条备忘？',function(){
    var memos=getMemos().filter(function(m){return m.id!==id});
    DB.set('memos',memos);
    renderMemo();
    toast('已删除','');
  });
}

// ====== Panel: Wheel ======
function renderWheel(){
  var opts=getWheelOptions();
  var html='<div class="card"><div class="card-title">🎰 转盘选项管理</div>';
  for(var cat in opts){
    var label=cat==='out'?'出去玩':'吃美食';
    html+='<div class="wheel-cat-label">'+label+'</div>';
    opts[cat].forEach(function(opt,i){
      html+='<div class="wheel-edit-row"><input type="text" value="'+esc(opt)+'" onchange="updateWheelAdmin(\''+cat+'\','+i+',this.value)"><button class="btn btn-sm btn-red" onclick="delWheelAdmin(\''+cat+'\','+i+')">删除</button></div>';
    });
    html+='<button class="btn btn-sm btn-outline" onclick="addWheelAdmin(\''+cat+'\')" style="margin-bottom:12px">+ 添加</button>';
  }
  html+='<div style="margin-top:8px"><button class="btn btn-sm btn-outline" onclick="resetWheelAdmin()">重置默认</button></div>';
  html+='</div>';
  document.getElementById('panel-wheel').innerHTML=html;
}
function updateWheelAdmin(cat,i,val){
  var opts=getWheelOptions();
  opts[cat][i]=val;
  DB.set('wheel_options',opts);
  toast('已更新 ✅','success');
}
function addWheelAdmin(cat){
  var opts=getWheelOptions();
  opts[cat].push('新选项');
  DB.set('wheel_options',opts);
  renderWheel();
  toast('已添加 ✅','success');
}
function delWheelAdmin(cat,i){
  showConfirm('删除这个选项？',function(){
    var opts=getWheelOptions();
    opts[cat].splice(i,1);
    DB.set('wheel_options',opts);
    renderWheel();
    toast('已删除','');
  });
}
function resetWheelAdmin(){
  showConfirm('重置转盘选项为默认值？',function(){
    DB.del('wheel_options');
    renderWheel();
    toast('已重置 ✅','success');
  });
}

// ====== Panel: Raw Data ======
function renderRaw(){
  var keys=DB.keys().sort();
  var html='<div class="card"><div class="card-title">🔧 原始数据浏览器</div>';
  html+='<div style="font-size:12px;color:var(--text-dim);margin-bottom:12px">共 '+keys.length+' 条数据。点击查看/编辑/删除。</div>';
  if(!keys.length){
    html+='<div class="empty">暂无数据</div>';
  }else{
    keys.forEach(function(k){
      var val=DB.get(k,null);
      var valStr=JSON.stringify(val);
      var preview=valStr.length>80?valStr.slice(0,80)+'...':valStr;
      html+='<div style="padding:8px 0;border-bottom:1px solid var(--border)">';
      html+='<div style="display:flex;justify-content:space-between;align-items:center">';
      html+='<code style="font-size:12px;color:var(--accent-light)">'+esc(k)+'</code>';
      html+='<div><button class="btn btn-sm btn-outline" onclick="editRawKey(\''+esc(k)+'\')">编辑</button> <button class="btn btn-sm btn-red" onclick="delRawKey(\''+esc(k)+'\')">删除</button></div>';
      html+='</div>';
      html+='<div style="font-size:11px;color:var(--text-dim);margin-top:2px;word-break:break-all">'+esc(preview)+'</div>';
      html+='</div>';
    });
  }
  html+='</div>';
  document.getElementById('panel-raw').innerHTML=html;
}
function editRawKey(key){
  var val=DB.get(key,null);
  var valStr=JSON.stringify(val,null,2);
  var html='<div class="card"><div class="card-title">编辑: '+esc(key)+'</div>';
  html+='<textarea class="input" id="raw-edit" style="min-height:200px;font-family:monospace;font-size:12px">'+esc(valStr)+'</textarea>';
  html+='<div style="margin-top:8px"><button class="btn btn-sm" onclick="saveRawKey(\''+esc(key)+'\')">💾 保存</button> <button class="btn btn-sm btn-outline" onclick="renderRaw()">返回</button></div>';
  html+='</div>';
  document.getElementById('panel-raw').innerHTML=html;
}
function saveRawKey(key){
  var text=document.getElementById('raw-edit').value;
  try{
    var val=JSON.parse(text);
    DB.set(key,val);
    toast('已保存 ✅','success');
    renderRaw();
  }catch(e){
    toast('JSON 格式错误！','warn');
  }
}
function delRawKey(key){
  showConfirm('删除数据 key: '+key+' ?',function(){
    DB.del(key);
    renderRaw();
    toast('已删除','');
  });
}

// ====== Panel: Backup ======
function renderBackup(){
  var html='<div class="card"><div class="card-title">💾 数据备份与恢复</div>';
  html+='<div class="section-label">导出数据</div>';
  html+='<p style="font-size:13px;color:var(--text-mid);margin-bottom:8px">导出全部数据为 JSON 文件，可用于备份或迁移。</p>';
  html+='<button class="btn btn-green" onclick="exportData()">📥 导出全部数据</button>';
  html+='<div class="section-label" style="margin-top:20px">导入数据</div>';
  html+='<p style="font-size:13px;color:var(--text-mid);margin-bottom:8px">粘贴 JSON 数据或选择文件导入。<strong style="color:var(--orange)">注意：导入会覆盖现有数据！</strong></p>';
  html+='<input type="file" accept=".json,.txt" onchange="importFromFile(event)" style="font-size:13px;margin-bottom:8px;width:100%">';
  html+='<textarea class="input" id="import-text" placeholder="粘贴 JSON 数据..." style="min-height:120px;font-family:monospace;font-size:12px"></textarea>';
  html+='<div style="margin-top:8px"><button class="btn" onclick="importData()">导入数据</button></div>';
  html+='<div class="section-label" style="margin-top:20px;color:var(--red)">⚠️ 危险操作</div>';
  html+='<button class="btn btn-red" onclick="clearAllData()">清空全部数据</button>';
  html+='</div>';
  document.getElementById('panel-backup').innerHTML=html;
}
function exportData(){
  var data={};
  DB.keys().forEach(function(k){data[k]=DB.get(k,null)});
  var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='gongkao_backup_'+today()+'.json';
  a.click();
  toast('已导出 '+Object.keys(data).length+' 条数据 ✅','success');
}
function importData(){
  var text=document.getElementById('import-text').value.trim();
  if(!text){toast('请粘贴数据','warn');return}
  showConfirm('导入数据将覆盖现有数据，确认？',function(){
    try{
      var data=JSON.parse(text);
      var count=0;
      for(var k in data){DB.set(k,data[k]);count++}
      toast('已导入 '+count+' 条数据 ✅','success');
      document.getElementById('import-text').value='';
      var active=document.querySelector('.nav-tab.active');
      if(active)active.click();
    }catch(e){toast('JSON 格式错误！','warn')}
  });
}
function importFromFile(e){
  var file=e.target.files[0];
  if(!file)return;
  var reader=new FileReader();
  reader.onload=function(ev){
    document.getElementById('import-text').value=ev.target.result;
    toast('文件已读取，点击「导入」确认','success');
  };
  reader.readAsText(file);
}
function clearAllData(){
  showConfirm('⚠️ 确认清空全部数据？此操作不可恢复！建议先导出备份。',function(){
    DB.keys().forEach(function(k){DB.del(k)});
    toast('全部数据已清空','');
    var active=document.querySelector('.nav-tab.active');
    if(active)active.click();
  });
}

// ===== Init ======
renderOverview();
</script>
</body>
